<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brotherhood</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <section class="room-setup" id="roomSetup">
            <form id="nameForm" class="setup-form">
                <h1>Brotherhood</h1>
                <label for="nameInput">Tên của bạn</label>
                <input type="text" id="nameInput" maxlength="40" autocomplete="name" required>
                <button type="submit">Tiếp tục</button>
            </form>

            <div id="roomChoices" class="setup-form" hidden>
                <h1>Chọn phòng chat</h1>
                <p id="selectedName"></p>
                <button type="button" id="showCreateForm">Tạo phòng</button>
                <button type="button" id="showJoinForm">Tham gia phòng</button>
                <button type="button" class="secondary-button" id="changeName">Đổi tên</button>
            </div>

            <form id="createRoomForm" class="setup-form" hidden>
                <h1>Tạo phòng</h1>
                <label for="createRoomName">Tên phòng</label>
                <input type="text" id="createRoomName" maxlength="60" required>
                <label for="createRoomPassword">Mật khẩu phòng</label>
                <input type="password" id="createRoomPassword" required>
                <button type="submit">Khởi tạo</button>
                <button type="button" class="secondary-button back-button">Quay lại</button>
            </form>

            <form id="joinRoomForm" class="setup-form" hidden>
                <h1>Tham gia phòng</h1>
                <label for="joinRoomName">Tên phòng</label>
                <input type="text" id="joinRoomName" maxlength="60" required>
                <label for="joinRoomPassword">Mật khẩu phòng</label>
                <input type="password" id="joinRoomPassword" required>
                <button type="submit">Tham gia</button>
                <button type="button" class="secondary-button back-button">Quay lại</button>
            </form>
            <p class="setup-error" id="setupError" role="alert" hidden></p>
        </section>

        <div class="status disconnected" id="status" hidden>[DISCONNECTED] Chưa kết nối</div>
        <div class="messages-frame" id="messagesFrame" hidden></div>
        <div class="input-container" id="chatInputContainer" hidden>
            <input type="file" id="imageInput" accept="image/*" multiple>
            <button id="imageButton" title="Gửi ảnh">📷</button>
            <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button id="sendButton">Enter</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Configuration - match server_web.py settings
        const SERVER_URL = window.location.origin;
        
        let socket = null;
        let isConnected = false;
        let isRegistered = false;
        let myName = '';
        let selectedName = '';

        const el = id => document.getElementById(id);
        const messagesFrame = el('messagesFrame');
        const messageInput = el('messageInput');
        const imageInput = el('imageInput');
        const statusDiv = el('status');
        const roomSetup = el('roomSetup');
        const setupError = el('setupError');

        const isSystemMsg = msg => ['Đã kết nối', 'ngắt kết nối', 'tham gia', 'thoát', 'Xin chào', 'Lỗi'].some(s => msg.includes(s));

        function addMessage(message, isImage = false, imageData = null, isOwn = false) {
            const div = document.createElement('div');
            const isSystem = isSystemMsg(message);
            div.className = `message-item ${isSystem ? 'system' : isOwn ? 'own' : 'other'}`;
            
            if (!isOwn) {
                const prompt = document.createElement('span');
                prompt.className = 'message-prompt';
                prompt.textContent = isSystem ? '[SYSTEM] ' : '> ';
                div.append(prompt);
            }
            
            if (isImage && imageData) {
                const span = document.createElement('span');
                span.textContent = message;
                const img = document.createElement('img');
                img.src = imageData;
                img.onclick = () => window.open(imageData, '_blank');
                div.append(span, img);
            } else {
                div.append(document.createTextNode(message));
            }
            
            messagesFrame.appendChild(div);
            messagesFrame.scrollTop = messagesFrame.scrollHeight;
        }

        const updateStatus = (msg, cls) => {
            statusDiv.textContent = `[${cls === 'connected' ? 'CONNECTED' : 'DISCONNECTED'}] ${msg}`;
            statusDiv.className = `status ${cls}`;
        };

        function connect() {
            try {
                // Configure Socket.IO for Cloudflare tunnel compatibility
                socket = io(SERVER_URL, {
                    transports: ['websocket', 'polling'],
                    upgrade: true,  
                    rememberUpgrade: false,  
                    reconnection: true,  
                    reconnectionDelay: 1000,
                    reconnectionDelayMax: 5000,
                    reconnectionAttempts: Infinity,
                    timeout: 20000,
                    forceNew: false
                });
                
                socket.on('connect', () => {
                    isConnected = true;
                    updateStatus('Đã kết nối', 'connected');
                    addMessage('Đã kết nối đến server.');
                });

                socket.on('message', data => {
                    const msg = data.data || data;
                    const isImg = data.type === 'image' && data.imageData;
                    const isOwn = myName && (msg.startsWith(`${myName}:`) || msg.startsWith(`${myName} đã gửi`));
                    addMessage(msg, isImg, data.imageData, isOwn);
                });

                socket.on('room_joined', data => {
                    isRegistered = true;
                    myName = data.name;
                    roomSetup.hidden = true;
                    el('status').hidden = false;
                    el('messagesFrame').hidden = false;
                    el('chatInputContainer').hidden = false;
                    updateStatus(`Đã vào phòng ${data.room}`, 'connected');
                    messageInput.focus();
                });

                socket.on('room_error', data => {
                    setupError.textContent = data.message;
                    setupError.hidden = false;
                });

                socket.on('connect_error', err => {
                    updateStatus('Lỗi kết nối', 'disconnected');
                    if (!isRegistered) {
                        setupError.textContent = 'Không thể kết nối đến server.';
                        setupError.hidden = false;
                    } else {
                        addMessage('Lỗi: Không thể kết nối đến server.');
                    }
                });

                socket.on('disconnect', () => {
                    isConnected = false;
                    updateStatus('Đã ngắt kết nối', 'disconnected');
                    if (isRegistered) addMessage('Đã ngắt kết nối từ server.');
                });

            } catch (error) {
                updateStatus('Lỗi kết nối', 'disconnected');
                addMessage(`Lỗi: ${error.message}`);
            }
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (!msg) return;
            if (!isConnected || !socket) {
                addMessage('Chưa kết nối đến server!');
                connect();
                return;
            }
            try {
                socket.emit('message', { message: msg });
                if (msg === '{quit}') {
                    socket.disconnect();
                    isRegistered = false;
                    myName = '';
                }
                messageInput.value = '';
            } catch (err) {
                addMessage(`Lỗi khi gửi tin nhắn: ${err.message}`);
            }
        }

        function sendImage(file) {
            if (!isConnected || !socket) {
                addMessage('Chưa kết nối đến server!');
                connect();
                return;
            }
            if (!isRegistered) return addMessage('Vui lòng nhập tên trước khi gửi ảnh!');
            if (file.size > 5 * 1024 * 1024) return addMessage('Ảnh quá lớn! Vui lòng chọn ảnh nhỏ hơn 5MB.');
            
            const loading = document.createElement('div');
            loading.className = 'message-item image-loading';
            loading.textContent = 'Đang tải ảnh...';
            messagesFrame.appendChild(loading);
            messagesFrame.scrollTop = messagesFrame.scrollHeight;
            
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    socket.emit('image', { imageData: e.target.result, fileName: file.name, fileType: file.type });
                } catch (err) {
                    addMessage(`Lỗi khi gửi ảnh: ${err.message}`);
                } finally {
                    loading.remove();
                }
            };
            reader.onerror = () => {
                loading.remove();
                addMessage('Lỗi khi đọc file ảnh.');
            };
            reader.readAsDataURL(file);
        }

        el('imageButton').onclick = () => { imageInput.value = ''; imageInput.click(); };
        imageInput.onchange = e => {
            const file = e.target.files?.[0];
            if (file?.type.startsWith('image/')) {
                sendImage(file);
                imageInput.value = '';
            } else if (file) addMessage('Vui lòng chọn file ảnh hợp lệ!');
        };
        el('sendButton').onclick = sendMessage;
        messageInput.onkeypress = e => { if (e.key === 'Enter') sendMessage(); };

        function showSetupPanel(panel) {
            [el('nameForm'), el('roomChoices'), el('createRoomForm'), el('joinRoomForm')]
                .forEach(form => { form.hidden = form !== panel; });
            setupError.hidden = true;
        }

        el('nameForm').addEventListener('submit', event => {
            event.preventDefault();
            selectedName = el('nameInput').value.trim();
            if (!selectedName) return;
            el('selectedName').textContent = `Tên: ${selectedName}`;
            showSetupPanel(el('roomChoices'));
        });

        el('showCreateForm').onclick = () => showSetupPanel(el('createRoomForm'));
        el('showJoinForm').onclick = () => showSetupPanel(el('joinRoomForm'));
        el('changeName').onclick = () => showSetupPanel(el('nameForm'));
        document.querySelectorAll('.back-button').forEach(button => {
            button.onclick = () => showSetupPanel(el('roomChoices'));
        });

        function requestRoomEntry(event, eventName, roomInput, passwordInput) {
            event.preventDefault();
            setupError.hidden = true;
            if (!isConnected || !socket) {
                setupError.textContent = 'Chưa kết nối đến server. Vui lòng thử lại.';
                setupError.hidden = false;
                return;
            }
            socket.emit(eventName, {
                name: selectedName,
                room: el(roomInput).value.trim(),
                password: el(passwordInput).value
            });
        }

        el('createRoomForm').addEventListener('submit', event => {
            requestRoomEntry(event, 'create_room', 'createRoomName', 'createRoomPassword');
        });
        el('joinRoomForm').addEventListener('submit', event => {
            requestRoomEntry(event, 'join_room', 'joinRoomName', 'joinRoomPassword');
        });

        document.onpaste = e => {
            if (!isRegistered) return;
            const item = Array.from(e.clipboardData.items).find(i => i.type.includes('image'));
            if (item) {
                e.preventDefault();
                const file = item.getAsFile();
                if (file) sendImage(file);
            }
        };

        connect();
        window.addEventListener('beforeunload', () => {
            if (socket && isConnected) {
                if (isRegistered) socket.emit('message', { message: '{quit}' });
                socket.disconnect();
            }
        });
    </script>
</body>
</html>
